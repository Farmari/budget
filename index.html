<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2546d6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Budget Tracker</title>
<style>
/* Layout: month tabs, summary tiles, money-flow bar, calendar beside income and class flow, daily budget beside credits, expense log, then needs / check / fund split. Funds tab holds summary and the three fund logs. */
:root{
  --bg:#F2F4F9; --surface:#FFFFFF; --sunk:#F6F7FB; --ink:#14203A; --muted:#566178; --line:#DCE1EB;
  --accent:#2447D6; --accent-ink:#FFFFFF; --bad:#C2312D; --good:#0B7F5F;
  --daily:#17819E; --log:#55607A; --sav:#0B7F5F; --wnt:#B96A00; --ann:#C03474;
  --display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1524; --surface:#171F33; --sunk:#121A2C; --ink:#E7ECF7; --muted:#9AA6BF; --line:#2A3550;
    --accent:#7C9BFF; --accent-ink:#0F1524; --bad:#FF7B73; --good:#4FD1A5;
    --daily:#4FC3DF; --log:#A3AEC8; --sav:#4FD1A5; --wnt:#F0B050; --ann:#F27AAA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1524; --surface:#171F33; --sunk:#121A2C; --ink:#E7ECF7; --muted:#9AA6BF; --line:#2A3550;
  --accent:#7C9BFF; --accent-ink:#0F1524; --bad:#FF7B73; --good:#4FD1A5;
  --daily:#4FC3DF; --log:#A3AEC8; --sav:#4FD1A5; --wnt:#F0B050; --ann:#F27AAA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font:700 28px/1.1 var(--display);margin:0;text-wrap:balance}
h2{font:600 16px/1.3 var(--display);margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.save{font-size:13px;color:var(--muted)}
.save.err{color:var(--bad)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:16px 0 12px;padding-bottom:4px}
.tab{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:500 14px var(--body);cursor:pointer}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab.add{border-style:dashed;color:var(--accent)}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.banner p{margin:0;flex:1 1 320px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font:500 14px var(--body);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.newm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 12px}
.stack{display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tile .lab{display:block;font-size:13px;color:var(--muted)}
.tile strong{display:block;font:700 28px/1.2 var(--display);font-variant-numeric:tabular-nums;margin:2px 0}
.tile small{color:var(--muted);font-size:13px}
.tile.good{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.tile.good strong{color:var(--good)}
.tile.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.tile.bad strong{color:var(--bad)}
.bar{display:flex;height:28px;border-radius:8px;overflow:hidden;background:var(--sunk);border:1px solid var(--line)}
.seg{height:100%;background:var(--c)}
.seg.short{background:repeating-linear-gradient(135deg,var(--bad) 0 4px,transparent 4px 8px)}
.barlab{font-size:12px;color:var(--muted);margin:8px 0 4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin:12px 0 0;padding:0;list-style:none;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.3fr) auto minmax(0,1fr) auto minmax(0,1.4fr);gap:8px;align-items:center}
.farr{display:flex;align-items:center;justify-content:center}
.fbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);min-width:0}
.fbox.good{border-color:color-mix(in srgb,var(--good) 55%,var(--line))}
.fbox.bad{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.fbox.good .v{color:var(--good)}
.fbox.bad .v{color:var(--bad)}
.fbox .t{font-size:12px;color:var(--muted)}
.fbox .v{font:700 20px/1.3 var(--display);font-variant-numeric:tabular-nums}
.fbox .fr{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-top:1px solid var(--line);margin-top:4px}
.flow>.farr{width:22px}.fbox .fr{flex-wrap:wrap;min-width:0}.fbox .fr>*{min-width:0}
@media (max-width:1080px){.flow{grid-template-columns:1fr}.farr svg{transform:rotate(90deg)}.farr{justify-self:center}}
@media (max-width:860px){.flow{grid-template-columns:1fr}.farr svg{transform:rotate(90deg)}}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:12px;align-items:start}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.grid3{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.grid3>.card{flex:0 1 280px}
.grid3>.card.wide{flex:1 1 280px}
@media (max-width:860px){.grid2,.grid2e{grid-template-columns:1fr}}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wd{font-size:12px;color:var(--muted);text-align:center}
.day{border:1px solid var(--line);border-radius:8px;padding:3px;display:flex;flex-direction:column;gap:2px;background:var(--surface);min-width:0}
.day.off{background:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--muted) 20%,transparent) 5px 6px),var(--sunk)}
.dn{display:flex;justify-content:space-between;align-items:center;border:0;background:none;color:var(--ink);font:600 13px var(--mono);cursor:pointer;padding:2px;border-radius:4px}
.dn i{font-style:normal;font-size:10px;color:var(--muted)}
.day input{width:100%;min-width:0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:500 12px var(--mono);text-align:right;padding:2px}
.keyline{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:12px 0 0}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-right:6px;background:var(--surface)}
.sw.off{background:repeating-linear-gradient(135deg,transparent 0 3px,color-mix(in srgb,var(--muted) 45%,transparent) 3px 4px),var(--sunk)}
.rows{margin:0;display:grid;gap:0}
.rows>div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.rows>div:last-child{border-bottom:0}
.rows dt{color:var(--muted)}
.rows dd{margin:0;font:500 14px var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rows .tot dt,.rows .tot dd{color:var(--ink);font-weight:600}
.rate{display:grid;grid-template-columns:1fr 110px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.rate label{color:var(--muted)}
.in{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 8px;font:400 14px var(--body)}
.in.warn{border-color:var(--wnt)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.r{text-align:right}
.logwrap{overflow-x:auto}
table.log{width:100%;min-width:420px;border-collapse:collapse}
.log th{font:500 12px var(--body);color:var(--muted);text-align:left;padding:4px 6px}
.log th.r{text-align:right}
.log td{padding:3px 4px;vertical-align:middle}
.log tfoot td{border-top:2px solid var(--line);padding-top:8px;font-weight:600}
.x{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{color:var(--bad)}
.addrow{display:grid;gap:8px;margin-top:12px;align-items:center}
.addrow.a4{grid-template-columns:minmax(120px,1.4fr) minmax(70px,.8fr) minmax(70px,.8fr) auto}
.addrow.a3{grid-template-columns:minmax(120px,1fr) minmax(90px,.7fr) auto}
.addrow.a5{grid-template-columns:140px minmax(120px,1.6fr) minmax(70px,.8fr) minmax(70px,.8fr) auto}
.addrow.ac{grid-template-columns:140px minmax(110px,1.2fr) minmax(80px,.8fr) auto}
@media (max-width:700px){.addrow.a4,.addrow.a5,.addrow.ac,.addrow.a3{grid-template-columns:1fr 1fr}}
.errmsg{color:var(--bad);font-size:13px;margin:6px 0 0;min-height:1em}
.note{color:var(--muted);font-size:13px;margin:0 0 10px}
.neg{color:var(--bad)}
.pos{color:var(--good)}
.funds{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.fund h2{display:flex;align-items:center;gap:8px}
.bigno{font:700 30px/1.2 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:500 12px var(--body);border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--bad) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad);margin-left:6px;vertical-align:middle}
table.fm{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.fm th,.fm td{padding:5px 4px;border-top:1px solid var(--line);text-align:left}
.fm td.r{text-align:right}
.fm thead th{border-top:0;color:var(--muted);font-weight:500}
.fm th.r{text-align:right}
.bars{display:grid;gap:3px;min-width:60px}
.b{display:block;height:6px;border-radius:3px;min-width:2px}
.b.add{background:var(--c)}
.b.use{background:var(--bad);opacity:.75}
.split{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:end}
.split label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.split .in{width:96px}
.fs{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.fs:last-child{border-bottom:0}
.fs span.n{display:flex;align-items:center;gap:8px}
.sr{position:absolute;left:-9999px}
/* polish */
:root{--shadow:0 1px 2px rgba(20,32,58,.05),0 14px 30px -16px rgba(20,32,58,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -18px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.4),0 16px 32px -18px rgba(0,0,0,.8)}
body{background:radial-gradient(900px 340px at 6% -6%,color-mix(in srgb,var(--accent) 15%,transparent),transparent 70%),radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.3px) 0 0/22px 22px,var(--bg)}
.wrap{padding-top:28px}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);font:700 23px var(--display);box-shadow:0 8px 18px -8px color-mix(in srgb,var(--accent) 85%,transparent)}
h1{font-size:30px;letter-spacing:-.01em}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.card{border-radius:18px;box-shadow:var(--shadow);animation:rise .4s ease both}
h2{font-size:17px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--accent);flex:none}
.fund h2::before{display:none}
.tabs{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;width:fit-content;max-width:100%;box-shadow:var(--shadow)}
.tab{border:0;background:transparent;padding:8px 16px;transition:background .15s,color .15s}
.tab:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
.tab.add{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));color:var(--accent)}
.banner{border-radius:14px;box-shadow:var(--shadow)}
.tile{--c:var(--accent);display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;padding:16px 18px}
.tile .ico{grid-row:1 / span 2;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.tile .lab{grid-column:2;align-self:end}
.tile strong{grid-column:2;font-size:34px;line-height:1.1;letter-spacing:-.01em;align-self:start}
.tile small{grid-column:1 / -1}
.tile small:empty{display:none}
.tile.good{--c:var(--good);background:color-mix(in srgb,var(--good) 7%,var(--surface))}
.tile.bad{--c:var(--bad);background:color-mix(in srgb,var(--bad) 7%,var(--surface))}
.fbox::before{content:"";display:block;height:4px;border-radius:2px;margin:-4px 0 8px;background:var(--c,var(--line))}
.fbox.inc{--c:var(--accent)}
.fbox.need{--c:var(--log)}
.fbox.good{--c:var(--good)}
.fbox.bad{--c:var(--bad)}
.fbox.fsplit::before{background:linear-gradient(90deg,var(--sav) 0 60%,var(--wnt) 60% 90%,var(--ann) 90% 100%)}
.fbox .v{font-size:24px}
.day{border-radius:10px;border-top:3px solid var(--accent);transition:transform .12s}
.day.off{border-top-color:var(--line)}
.day:hover{transform:translateY(-1px)}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.dn{font-size:14px}
.day input:focus{outline:none;border-bottom-color:var(--accent)}
.btn{transition:transform .1s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{box-shadow:0 6px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
.in:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.log tbody tr:hover{background:var(--sunk)}
.card.fund{border-top:4px solid var(--c)}
.bigno{font-size:34px}
.stepn{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--accent) 14%,var(--surface));color:var(--accent);font:600 13px var(--mono)}
/* fill space */
.grid2,.grid2e{align-items:stretch}
.grid2>.stack{display:flex}
.grid2>.stack>.card{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.grid2>.stack>.card .rate{padding:16px 0}
.grid2>.stack>.card dl.rows>div{padding:14px 0}
.grid2e>.card,.funds>.card{display:flex;flex-direction:column}
.grid2e>.card .addrow,.funds>.card .addrow{margin-top:auto;padding-top:14px}
.card .logwrap{flex:0 0 auto}
.three{align-items:stretch}
/* narrow cards: tidy 2-column add rows, no blank gaps */
.card{container-type:inline-size}
@container (max-width:680px){
 .addrow.a4,.addrow.a5,.addrow.ac,.addrow.a3{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .addrow>*{min-width:0;width:100%}
 .addrow.a3>.btn{grid-column:1 / -1}
 .addrow.a4>:first-child,.addrow.a4>.btn,.addrow.ac>:first-child,.addrow.ac>.btn{grid-column:1 / -1}
}
@media (max-width:900px){
 .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tiles>:last-child{grid-column:1 / -1}
}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
/* needs + check side by side, fund split fills the rest */
.grid3{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.grid3>.card{flex:1 1 220px;min-width:0}
.grid3>.card.wide{flex:2 1 300px}
.grid3 .rows>div{gap:8px;flex-wrap:wrap}
@media (max-width:760px){.grid3 .card{padding:14px 12px}.grid3 .rows,.grid3 .fs{font-size:13px}.grid3 h2{font-size:15px}}
@media (max-width:480px){.grid3>.card{flex-basis:100%}}
/* capitalized titles */
h1,h2,.stepn+span>b,.fbox .t{text-transform:uppercase}
h1{letter-spacing:.02em;font-size:26px}
h2{letter-spacing:.05em;font-size:15px}
.stepn+span>b{letter-spacing:.04em;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">₱</span><h1>Budget Tracker</h1></div>
    <div class="save" id="saveState" role="status" aria-live="polite"></div>
  </header>
  <nav class="tabs" id="tabs" aria-label="Months"></nav>
  <div id="banners"></div>
  <main id="view"></main>
</div>

<script>
(function(){
'use strict';

/*LOGIC-START*/
var FUNDS=[
  {name:'Savings',css:'--sav'},
  {name:'Wants',css:'--wnt'},
  {name:'Anniversary',css:'--ann'}
];
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function dim(y,m){return new Date(y,m+1,0).getDate();}
function mkey(y,m){return y+'-'+String(m+1).padStart(2,'0');}
function r2(n){return Math.round(n*100)/100;}
function num(v){var n=parseFloat(String(v==null?'':v).replace(/[₱,\s]/g,''));return isFinite(n)?n:0;}
function lineTotal(l){return num(l.b)+num(l.x);}
var _n=0;
function uid(){_n++;return 'i'+Date.now().toString(36)+_n.toString(36)+Math.random().toString(36).slice(2,5);}
function pad2(n){return String(n).padStart(2,'0');}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}

function calc(m,split){
  var n=dim(m.y,m.m);
  var nc=(m.nc||[]).filter(function(d){return d>=1&&d<=n;});
  var school=n-nc.length;
  var allow=0;
  for(var d=1;d<=n;d++){allow+=num(m.allow[d]);}
  var income=allow+num(m.sch)+num(m.side);
  var daily=0;
  (m.items||[]).forEach(function(it){daily+=school*num(it.r);});
  var log=0;
  (m.lines||[]).forEach(function(l){log+=lineTotal(l);});
  var cred=0;
  (m.credits||[]).forEach(function(c){cred+=num(c.a);});
  var needs=Math.max(0,r2(daily+log-cred));
  var diff=r2(income-needs);
  var left=Math.max(0,diff);
  var short=Math.max(0,-diff);
  var added=FUNDS.map(function(f,i){return r2(left*num(split[i])/100);});
  var dailyNet=Math.max(0,daily-cred);
  return {n:n,school:school,ncCount:nc.length,allow:allow,income:income,daily:daily,log:log,cred:cred,needs:needs,
    left:left,short:short,added:added,dailyNet:dailyNet,logNet:Math.max(0,needs-dailyNet)};
}

function ledger(state){
  return FUNDS.map(function(f,i){
    var rows={};
    Object.keys(state.months).forEach(function(k){
      rows[k]={add:calc(state.months[k],state.split).added[i],used:0};
    });
    (state.fundLogs[f.name]||[]).forEach(function(l){
      var k=(l.dt&&/^\d{4}-\d{2}/.test(l.dt))?l.dt.slice(0,7):'none';
      if(!rows[k])rows[k]={add:0,used:0};
      rows[k].used=r2(rows[k].used+lineTotal(l));
    });
    var keys=Object.keys(rows).filter(function(k){return k!=='none';}).sort();
    if(rows.none)keys.push('none');
    var bal=0,added=0,used=0;
    var list=keys.map(function(k){
      bal=r2(bal+rows[k].add-rows[k].used);
      added=r2(added+rows[k].add);
      used=r2(used+rows[k].used);
      return {key:k,add:rows[k].add,used:rows[k].used,bal:bal};
    });
    return {rows:list,bal:bal,added:added,used:used};
  });
}

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function valid(s){return s&&s.v===2&&s.months&&s.fundLogs;}
var state=loadLocal();
if(!valid(state)){state=seedState();}

ui.tab=pickTab();

var ref=null,remoteReady=false,dirty=false,saving=false,again=false,saveTimer=null;

function setSave(kind){
  var el=document.getElementById('saveState');
  var map={account:'',local:'',saving:'',slow:'Still connecting. Changes are kept on this device.',error:'Could not save to your account. Changes are kept on this device.'};
  el.textContent=map[kind]||'';
  el.className='save'+(kind==='error'?' err':'');
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
function clone(o){return JSON.parse(JSON.stringify(o));}
async function flush(){
  if(!ref||!remoteReady)return;
  if(saving){again=true;return;}
  saving=true;setSave('saving');
  try{
    await ref.set({state:clone(state)});
    setSave('account');
  }catch(e){
    if(e&&e.code==='unavailable'){
      await sleep(700+Math.random()*600);
      try{await ref.set({state:clone(state)});setSave('account');}catch(e2){setSave('error');}
    }else{setSave('error');}
  }
  saving=false;
  if(again){again=false;flush();}
}
function touched(){
  dirty=true;
  if(state.months[ui.tab])state.sel=ui.tab;
  saveLocal();
  if(!ref||!remoteReady){setSave('local');return;}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flush,700);
}

(async function connect(){
  try{
    if(typeof claude==='undefined'||!claude.use)return;
    var got=await Promise.all([claude.use('db'),claude.use('user')]);
    var db=got[0],user=got[1];
    var id=user&&user.id?await user.id():null;
    if(!db||!id)return;
    var r=db.collection('data/users/'+id).doc('tracker');
    var timer=setTimeout(function(){setSave('slow');},10000);
    var snap=await r.get();
    clearTimeout(timer);
    var data=snap.exists?snap.data():null;
    if(data&&valid(data.state)&&!dirty){
      state=clone(data.state);
      state.split=FIXED_SPLIT.slice();
      ui.tab=pickTab();
      saveLocal();
      render();
    }
    ref=r;remoteReady=true;setSave('account');
    if(dirty)flush();
  }catch(e){setSave('local');}
})();

  var m=state.months[ui.tab];if(!m)return;
  var c=calc(m,state.split);
  document.querySelectorAll('[data-out]').forEach(function(el){
    var k=el.getAttribute('data-out');
    if(k.indexOf('row:')===0){
      var l=byId(m.lines,k.slice(4));el.textContent=l?fmt(lineTotal(l)):'';
    }else if(k.indexOf('irow:')===0){
      var it=byId(m.items,k.slice(5));el.textContent=it?fmt(c.school*num(it.r)):'';
    }else if(OUT[k]){el.innerHTML=OUT[k](c,m);}
  });
  var t=document.getElementById('tileLeft');
  if(t)t.className='card tile '+(c.income>=c.needs?'good':'bad');
}

/* ---------- funds view ---------- */
function fundsHTML(){
  return '<div class="stack">'+
    '<section class="card"><h2>Fund split</h2>'+
    '<div>'+FUNDS.map(function(f,i){return '<div class="fs"><span class="n"><span class="dot" style="--c:var('+f.css+')"></span>'+f.name+'</span><b class="mono">'+FIXED_SPLIT[i]+'%</b></div>';}).join('')+'</div></section>'+
    '<div id="fundSummary" class="stack"></div>'+
    '<div class="funds" id="fundLogs">'+FUNDS.map(fundLogHTML).join('')+'</div></div>';
}
function fundLogHTML(f){
  var log=state.fundLogs[f.name]||[];
  var rows=log.length?log.map(function(l){return lineRow(l,'flog',' data-fund="'+f.name+'"');}).join(''):'<tr><td colspan="6" class="note" style="padding:14px 6px">Nothing logged yet.</td></tr>';
  return '<section class="card fund" style="--c:var('+f.css+')" data-fund="'+f.name+'"><h2><span class="dot" style="--c:var('+f.css+')"></span>Expense log ('+f.name+')</h2>'+
    '<div class="logwrap"><table class="log" style="min-width:560px"><thead><tr><th>Date</th><th>Expense name</th><th class="r">Budget</th><th class="r">Extra cost</th><th class="r">Total</th><th><span class="sr">Remove</span></th></tr></thead><tbody>'+rows+'</tbody>'+
    '<tfoot><tr><td colspan="4">Expense log total</td><td class="r mono" data-out="ftot:'+f.name+'"></td><td></td></tr></tfoot></table></div>'+
    '<form class="addrow a5 flogform" data-fund="'+f.name+'" autocomplete="off"><input class="in" type="date" name="dt" value="'+todayISO()+'" aria-label="Date"><input class="in" type="text" name="n" placeholder="What did you buy?" aria-label="Expense name"><input class="in mono r" name="b" inputmode="decimal" placeholder="Budget" aria-label="Budget"><input class="in mono r" name="x" inputmode="decimal" placeholder="Fare or extra" aria-label="Extra cost, such as fare to buy the item"><button class="btn pri" type="submit">Add</button></form><p class="errmsg" role="alert"></p></section>';
}
function updateFunds(){
  var Lg=ledger(state);
  var sum='<section class="card"><h2>Fund summary</h2><table class="fm" style="margin-top:0"><thead><tr><th>Funds</th><th class="r">Added</th><th class="r">Used</th><th class="r">Balance</th></tr></thead><tbody>'+
    FUNDS.map(function(f,i){var g=Lg[i];return '<tr><th scope="row" style="font-weight:600"><span class="dot" style="--c:var('+f.css+');display:inline-block;margin-right:8px"></span>'+f.name+'</th><td class="r mono">'+fmt(g.added)+'</td><td class="r mono">'+fmt(g.used)+'</td><td class="r mono '+(g.bal<0?'neg':'')+'">'+fmt(g.bal)+'</td></tr>';}).join('')+
    '</tbody></table></section>';
  var cards='<div class="funds">'+FUNDS.map(function(f,i){
    var g=Lg[i];
    var mx=Math.max(1,Math.max.apply(null,g.rows.map(function(r){return Math.max(r.add,r.used);})));
    var rows=g.rows.map(function(r){
      return '<tr><th scope="row" style="font-weight:500">'+mlabel(r.key)+'</th><td><div class="bars" style="--c:var('+f.css+')"><i class="b add" style="width:'+(r.add/mx*100)+'%"></i><i class="b use" style="width:'+(r.used/mx*100)+'%"></i></div></td>'+
        '<td class="r mono pos">+'+fmt(r.add)+'</td><td class="r mono">−'+fmt(r.used)+'</td><td class="r mono '+(r.bal<0?'neg':'')+'">'+fmt(r.bal)+'</td></tr>';
    }).join('');
    return '<section class="card fund" style="--c:var('+f.css+')"><h2><span class="dot" style="--c:var('+f.css+')"></span>'+f.name+'</h2>'+
      '<div class="bigno '+(g.bal<0?'neg':'')+'">'+fmt(g.bal)+(g.bal<0?'<span class="pill">Overspent</span>':'')+'</div>'+
      '<div class="note">Added '+fmt(g.added)+' · Used '+fmt(g.used)+'</div>'+
      '<table class="fm"><thead><tr><th>Month</th><th>Added / used</th><th class="r">Added</th><th class="r">Used</th><th class="r">Balance</th></tr></thead><tbody>'+rows+'</tbody></table></section>';
  }).join('')+'</div>';
  var el=document.getElementById('fundSummary');if(el)el.innerHTML=sum+cards;
  var sc=document.getElementById('splitCheck');
  if(sc){
    var t=num(state.split[0])+num(state.split[1])+num(state.split[2]);
    sc.innerHTML=(Math.abs(t-100)<0.001)?'<span class="pos">Total 100%</span>':'<span class="neg">Total is '+r2(t)+'%. Make it 100%.</span>';
  }
  document.querySelectorAll('[data-out^="ftot:"]').forEach(function(e){
    var name=e.getAttribute('data-out').slice(5);
    e.textContent=fmt((state.fundLogs[name]||[]).reduce(function(s,l){return s+lineTotal(l);},0));
  });
  document.querySelectorAll('[data-out^="frow:"]').forEach(function(e){
    var id=e.getAttribute('data-out').slice(5),tr=e.closest('tr'),fn=tr&&tr.getAttribute('data-fund');
    var l=fn&&byId(state.fundLogs[fn]||[],id);e.textContent=l?fmt(lineTotal(l)):'';
  });
}

function guideHTML(){
  var steps=[
    ['Start a month','Tap + New month, or the Start button at the top. The calendar builds itself, and your daily budget list is copied from last month.'],
    ['Fill in the calendar','Tap a date to make it a no-class day (H). Type the allowance you were given on that day, and Income plan adds it all up.'],
    ['Add scholarship and side hustle','Type them in Income plan if you get them this month, or leave them empty.'],
    ['Set your daily budget','Put the cost per school day for each item, and edit it when a price changes, such as ₱40 to ₱44.'],
    ['Log your expenses','Add each purchase with its Budget. Extra cost is the fare or extra money you spent to get to the store and buy it.'],
    ['Add budget credits','When you spend less than your daily budget, add the unspent amount and its type. The date fills in today, and the amount comes off your needs.'],
    ['Read the budget check','Money left is income minus needs and never goes below ₱0. If you are short, Amount needed shows by how much.'],
    ['Let the funds fill','Money left splits 60% Savings, 30% Wants and 10% Anniversary. Log what you spend from each fund on the Fund summary tab, and your monthly budget stays the same.'],
    ['Delete a month','Open the month and use Delete this month at the bottom. It asks you to confirm first.']
  ];
  var boxes=[['Allowance','Money in','--accent'],['Needs','Paid first','--log'],['Money left','Never below ₱0','--good'],['Funds','60 / 30 / 10','--wnt']];
  var svg='<svg width="100%" viewBox="0 0 680 92" role="img" aria-label="Allowance pays needs first, the money left splits into three funds"><defs><marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  boxes.forEach(function(b,i){
    var x=20+i*170;
    svg+='<rect x="'+x+'" y="16" width="130" height="60" rx="12" fill="var(--surface)" stroke="var('+b[2]+')" stroke-width="1.6"/>'+
      '<text x="'+(x+65)+'" y="42" text-anchor="middle" fill="var(--ink)" style="font:600 14px var(--body)">'+b[0]+'</text>'+
      '<text x="'+(x+65)+'" y="62" text-anchor="middle" fill="var(--muted)" style="font:400 12px var(--body)">'+b[1]+'</text>';
    if(i<3)svg+='<line x1="'+(x+136)+'" y1="46" x2="'+(x+164)+'" y2="46" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#ga)"/>';
  });
  svg+='</svg>';
  return '<div class="stack"><section class="card"><h2>How the tracker works</h2>'+svg+'</section>'+
    '<section class="card"><h2>Step by step</h2><ol style="margin:0;padding:0;list-style:none;display:grid;gap:12px">'+
    steps.map(function(s,i){return '<li style="display:grid;grid-template-columns:28px 1fr;gap:10px"><span class="stepn">'+(i+1)+'</span><span><b>'+esc(s[0])+'</b><br><span style="color:var(--muted)">'+esc(s[1])+'</span></span></li>';}).join('')+
    '</ol></section>'+
    '<section class="card"><h2>Backup</h2><p style="margin:0 0 12px;color:var(--muted)">Save your data to a file, or load a saved file to move it to another copy of the tracker, such as the offline one.</p>'+
    '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><button class="btn pri" type="button" data-act="export">Save backup</button>'+
    '<label class="btn" style="cursor:pointer">Load backup<input type="file" accept=".json,application/json" data-act="import" style="display:none"></label></div>'+
    '<p class="note" id="bkMsg" role="status" style="margin:10px 0 0"></p></section></div>';
}

function render(){
  renderTabs();renderBanners();
  var v=$('#view');
  if(ui.tab==='guide'){v.innerHTML=guideHTML();}
  else if(ui.tab==='funds'){v.innerHTML=fundsHTML();updateFunds();}
  else if(state.months[ui.tab]){v.innerHTML=monthHTML(ui.tab);updateOutputs();}
  else{v.innerHTML='';}
}

/* ---------- events ---------- */
function startMonth(y,mo){
  var k=mkey(y,mo),keys=Object.keys(state.months).sort(),prev=null;
  keys.forEach(function(x){if(x<k)prev=state.months[x];});
  if(!prev&&keys.length)prev=state.months[keys[keys.length-1]];
  state.months[k]=newMonth(y,mo,prev);
  ui.tab=k;ui.adding=false;touched();render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');
  if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  var a=b.getAttribute('data-act');
  var m=state.months[ui.tab];
  var id=b.getAttribute('data-id');
  if(a==='export'){
    try{
      var blob=new Blob([JSON.stringify(state)],{type:'application/json'});
      var u=URL.createObjectURL(blob),l=document.createElement('a');
      l.href=u;l.download='budget-tracker-backup-'+todayISO()+'.json';document.body.appendChild(l);l.click();l.remove();
      setTimeout(function(){URL.revokeObjectURL(u);},2000);
      var mm=document.getElementById('bkMsg');if(mm)mm.textContent='Backup saved to your downloads.';
    }catch(err){var m2=document.getElementById('bkMsg');if(m2)m2.textContent='Could not save the backup here.';}
  }
  else if(a==='tab'){ui.tab=b.getAttribute('data-k');ui.adding=false;ui.confirmDel=null;if(state.months[ui.tab]){state.sel=ui.tab;saveLocal();}render();}
  else if(a==='toggle'&&m){
    var d=+b.getAttribute('data-d'),i=m.nc.indexOf(d);
    if(i>=0)m.nc.splice(i,1);else m.nc.push(d);
    b.setAttribute('aria-pressed',i<0);
    b.closest('.day').classList.toggle('off',i<0);
    b.innerHTML=d+(i<0?'<i>H</i>':'');
    touched();updateOutputs();
  }
  else if(a==='del'&&m){m.lines=m.lines.filter(function(l){return l.id!==id;});touched();render();}
  else if(a==='delitem'&&m){m.items=m.items.filter(function(l){return l.id!==id;});touched();render();}
  else if(a==='delcredit'&&m){m.credits=m.credits.filter(function(l){return l.id!==id;});touched();render();}
  else if(a==='delflog'){
    var fn=b.closest('tr').getAttribute('data-fund');
    state.fundLogs[fn]=state.fundLogs[fn].filter(function(l){return l.id!==id;});
    touched();render();
  }
  else if(a==='delmonth1'){ui.confirmDel=ui.tab;render();}
  else if(a==='delmonth0'){ui.confirmDel=null;render();}
  else if(a==='delmonth2'&&m){
    delete state.months[ui.tab];
    ui.confirmDel=null;
    ui.tab=Object.keys(state.months).sort().pop()||'funds';
    if(ui.tab!=='funds')state.sel=ui.tab;
    touched();render();
  }
  else if(a==='newmonth'){ui.adding=!ui.adding;renderBanners();}
  else if(a==='cancelnew'){ui.adding=false;renderBanners();}
  else if(a==='create'){
    var mo=+document.getElementById('nmM').value,yr=+document.getElementById('nmY').value;
    var k=mkey(yr,mo);
    if(state.months[k]){document.getElementById('nmErr').textContent=mfull(k)+' already exists.';return;}
    startMonth(yr,mo);
  }
  else if(a==='startcur'){startMonth(now.getFullYear(),now.getMonth());}
  else if(a==='hidecur'){ui.dismissedCur=true;renderBanners();}
  else if(a==='dismiss'){state.imported=false;touched();renderBanners();}
  else if(a==='fresh1'){ui.confirmFresh=true;renderBanners();}
  else if(a==='fresh0'){ui.confirmFresh=false;renderBanners();}
  else if(a==='fresh2'){
    state={v:2,split:[60,30,10],months:{},sel:curKey,imported:false,fundLogs:{Savings:[],Wants:[],Anniversary:[]}};
    state.months[curKey]=newMonth(now.getFullYear(),now.getMonth(),null);
    ui.tab=curKey;ui.confirmFresh=false;touched();render();
  }
});

document.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='import'){
    var fl=el.files&&el.files[0];if(!fl)return;
    var rd=new FileReader();
    rd.onload=function(){
      var mm=document.getElementById('bkMsg');
      try{
        var d=JSON.parse(rd.result);
        if(!valid(d))throw new Error('bad');
        state=d;state.split=FIXED_SPLIT.slice();ui.tab=pickTab();dirty=true;saveLocal();touched();render();
        ui.tab='guide';render();
        var m3=document.getElementById('bkMsg');if(m3)m3.textContent='Backup loaded.';
      }catch(err){if(mm)mm.textContent='That file is not a Budget Tracker backup.';}
    };
    rd.readAsText(fl);el.value='';return;
  }
  var m=state.months[ui.tab];
  var f=el.getAttribute('data-f');
  var tr=el.closest('tr');
  var id=tr&&tr.getAttribute('data-id');
  if(a==='allow'&&m){
    var d=+el.getAttribute('data-d'),v=cleanNum(el.value);
    if(v)m.allow[d]=v;else delete m.allow[d];
    el.value=v||'';touched();updateOutputs();
  }else if(a==='field'&&m){
    m[f]=cleanNum(el.value);el.value=m[f]||'';touched();updateOutputs();
  }else if(a==='line'&&m){
    var l=byId(m.lines,id);if(!l)return;
    if(f==='n'){l.n=el.value.trim();el.classList.toggle('warn',!l.n);}
    else{l[f]=cleanNum(el.value);el.value=l[f]||'';}
    touched();updateOutputs();
  }else if(a==='item'&&m){
    var it=byId(m.items,id);if(!it)return;
    if(f==='n'){it.n=el.value.trim();el.classList.toggle('warn',!it.n);}
    else{it.r=cleanNum(el.value);el.value=it.r||'';}
    touched();updateOutputs();
    var dl=document.getElementById('creditTypes');
    if(dl)dl.innerHTML=m.items.filter(function(x){return x.n;}).map(function(x){return '<option value="'+esc(x.n)+'">';}).join('');
  }else if(a==='credit'&&m){
    var cr=byId(m.credits,id);if(!cr)return;
    if(f==='t'){cr.t=el.value.trim();el.classList.toggle('warn',!cr.t);}
    else if(f==='dt'){cr.dt=el.value;}
    else{cr.a=cleanNum(el.value);el.value=cr.a||'';}
    touched();updateOutputs();
  }else if(a==='flog'){
    var fn=tr.getAttribute('data-fund');
    var fl=byId(state.fundLogs[fn]||[],id);if(!fl)return;
    if(f==='n'){fl.n=el.value.trim();el.classList.toggle('warn',!fl.n);}
    else if(f==='dt'){fl.dt=el.value;}
    else{fl[f]=cleanNum(el.value);el.value=fl[f]||'';}
    touched();updateFunds();
  }else if(a==='split'){
    var i=+el.getAttribute('data-i');state.split[i]=Math.min(100,cleanNum(el.value));el.value=state.split[i];
    touched();updateFunds();
  }
});

document.addEventListener('submit',function(e){
  var form=e.target;
  e.preventDefault();
  var m=state.months[ui.tab];
  if(form.id==='addForm'&&m){
    var err=document.getElementById('addErr');
    var n=document.getElementById('addN').value.trim();
    var b=cleanNum(document.getElementById('addB').value);
    var x=cleanNum(document.getElementById('addX').value);
    if(!n){err.textContent='Name the expense first.';document.getElementById('addN').focus();return;}
    if(!b&&!x){err.textContent='Enter the amount in Budget.';document.getElementById('addB').focus();return;}
    m.lines.push({id:uid(),n:n,b:b,x:x});
    touched();render();
    var nn=document.getElementById('addN');if(nn)nn.focus();
  }else if(form.id==='addItem'&&m){
    var e1=document.getElementById('aiErr');
    var n1=document.getElementById('aiN').value.trim(),r1=cleanNum(document.getElementById('aiR').value);
    if(!n1){e1.textContent='Name the item first.';document.getElementById('aiN').focus();return;}
    if(!r1){e1.textContent='Enter the cost per school day.';document.getElementById('aiR').focus();return;}
    m.items.push({id:uid(),n:n1,r:r1});touched();render();
  }else if(form.id==='addCredit'&&m){
    var e2=document.getElementById('acErr');
    var t2=document.getElementById('acT').value.trim(),a2=cleanNum(document.getElementById('acA').value);
    if(!t2){e2.textContent='Choose or type what the credit is for.';document.getElementById('acT').focus();return;}
    if(!a2){e2.textContent='Enter the amount.';document.getElementById('acA').focus();return;}
    m.credits.push({id:uid(),t:t2,a:a2,dt:document.getElementById('acD').value||todayISO()});touched();render();
  }else if(form.classList.contains('flogform')){
    var fn=form.getAttribute('data-fund'),em=form.parentNode.querySelector('.errmsg');
    var n3=form.elements.n.value.trim(),b3=cleanNum(form.elements.b.value),x3=cleanNum(form.elements.x.value);
    if(!n3){em.textContent='Name the expense first.';form.elements.n.focus();return;}
    if(!b3&&!x3){em.textContent='Enter the amount in Budget.';form.elements.b.focus();return;}
    state.fundLogs[fn].push({id:uid(),n:n3,b:b3,x:x3,dt:form.elements.dt.value||todayISO()});
    touched();render();
  }
});

setSave('local');
render();
})();
</script>
<script>if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
